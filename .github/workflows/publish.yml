name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch to publish from (e.g. v1.2.3)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish-typescript:
    name: Publish TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: budget-buddy-org/budget-buddy-workflows/.github/actions/setup-node@7494014b779e158da778a98d4174575757ef176d

      - name: Extract version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Generate TypeScript client
        run: pnpm run generate:ts

      - name: Inject version into package manifest
        run: |
          jq --arg v "${{ steps.version.outputs.version }}" '.version = $v' \
            config/typescript-package.json > generated/typescript/package.json

      - name: Publish to GitHub Packages (npm)
        run: pnpm publish generated/typescript --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-java:
    name: Publish Java
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}

      - uses: budget-buddy-org/budget-buddy-workflows/.github/actions/setup-java@7494014b779e158da778a98d4174575757ef176d
      - uses: budget-buddy-org/budget-buddy-workflows/.github/actions/setup-node@7494014b779e158da778a98d4174575757ef176d
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Extract version from package.json
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Publish to GitHub Packages (Maven)
        run: >-
          ./gradlew publishMavenJavaPublicationToGitHubPackagesRepository
          -PartifactVersion=${{ steps.version.outputs.version }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
