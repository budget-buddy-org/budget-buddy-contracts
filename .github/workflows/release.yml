name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview release from this ref
        type: boolean
        default: true
permissions:
  contents: read
  packages: read
jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  release:
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry-run)
    uses: budget-buddy-org/budget-buddy-workflows/.github/workflows/release.yml@b7507539ebca6a6c2ba7da83a40033527fc5e85f
    with:
      profile: contracts
      dry-run: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      RELEASE_BOT_ID: ${{ secrets.RELEASE_BOT_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
