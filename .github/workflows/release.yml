name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview release from this ref
        type: boolean
        default: true
permissions:
  contents: read
  packages: read
jobs:
  validate:
    uses: budget-buddy-org/ci-workflows/.github/workflows/contracts-validation.yml@ad780d45400f3a82e82a817a8ad4cd1f5f89c989
  release:
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry-run)
    uses: budget-buddy-org/ci-workflows/.github/workflows/release.yml@ad780d45400f3a82e82a817a8ad4cd1f5f89c989
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      RELEASE_BOT_ID: ${{ secrets.RELEASE_BOT_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
