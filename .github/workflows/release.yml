name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview release from this ref
        type: boolean
        default: true
permissions:
  contents: read
  packages: read
jobs:
  validate:
    uses: budget-buddy-org/budget-buddy-workflows/.github/workflows/contracts-validation.yml@6ca650db05a934bd612faac664149938e763cfed
  release:
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry-run)
    uses: budget-buddy-org/budget-buddy-workflows/.github/workflows/release.yml@6ca650db05a934bd612faac664149938e763cfed
    with:
      profile: contracts
      dry-run: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      RELEASE_BOT_ID: ${{ secrets.RELEASE_BOT_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
