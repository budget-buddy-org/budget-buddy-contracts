name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Preview the default branch release
        type: boolean
        default: true
permissions:
  contents: read
  packages: read
jobs:
  validate:
    uses: budget-buddy-org/ci-workflows/.github/workflows/contracts-validation.yml@1736e615609d211e1cdbe74314e4199faed158b6
  release:
    needs: validate
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry-run)
    uses: budget-buddy-org/ci-workflows/.github/workflows/release.yml@1736e615609d211e1cdbe74314e4199faed158b6
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' }}
    secrets:
      RELEASE_BOT_ID: ${{ secrets.RELEASE_BOT_ID }}
      RELEASE_BOT_PRIVATE_KEY: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
