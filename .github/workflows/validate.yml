name: Validate

on:
  pull_request:
    paths:
      - "specs/**"
      - "config/**"
      - ".spectral.yaml"
      - "openapi-ts.config.ts"
      - "openapitools.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/**"

permissions:
  contents: read
  packages: read


jobs:
  validate:
    uses: budget-buddy-org/ci-workflows/.github/workflows/contracts-validation.yml@ad780d45400f3a82e82a817a8ad4cd1f5f89c989
