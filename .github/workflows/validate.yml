name: Validate

on:
  pull_request:
    paths:
      - "specs/**"
      - "config/**"
      - ".spectral.yaml"
      - "openapi-ts.config.ts"
      - "openapitools.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/**"

permissions:
  contents: read
  packages: read


jobs:
  validate:
    uses: budget-buddy-org/ci-workflows/.github/workflows/contracts-validation.yml@1736e615609d211e1cdbe74314e4199faed158b6
