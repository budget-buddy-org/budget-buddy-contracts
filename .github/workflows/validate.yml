name: Validate

on:
  pull_request:
    paths:
      - "specs/**"
      - "config/**"
      - ".spectral.yaml"
      - "openapi-ts.config.ts"
      - "openapitools.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.lockfile"
      - "scripts/**"
      - "tests/java-consumer/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/**"

permissions:
  contents: read
  packages: read


jobs:
  validate:
    uses: budget-buddy-org/budget-buddy-workflows/.github/workflows/contracts-validation.yml@7494014b779e158da778a98d4174575757ef176d
