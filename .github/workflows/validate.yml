name: Validate

on:
  pull_request:
    paths:
      - "specs/**"
      - "config/**"
      - ".spectral.yaml"
      - "openapi-ts.config.ts"
      - "openapitools.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@9bbca1e9dc2902adb87e8780fe5c98796985a62d # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: "pnpm"

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: "25"
          distribution: "temurin"

      - run: pnpm install --frozen-lockfile

      - name: Lint spec
        run: pnpm run lint

      - name: Validate spec
        run: pnpm run validate

      - name: Smoke-test TypeScript generation
        run: pnpm run generate:ts

      - name: Typecheck generated TypeScript client
        run: pnpm exec tsc --noEmit --emitDeclarationOnly false

      - name: Smoke-test Java generation
        run: pnpm run generate:java

      - name: Compile generated Java server stubs
        run: mvn --file generated/java/pom.xml --no-transfer-progress -DskipTests package
