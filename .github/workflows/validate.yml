name: Validate

on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: contracts-validation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: budget-buddy-org/budget-buddy-workflows/.github/actions/setup-java@6ca650db05a934bd612faac664149938e763cfed
      - uses: budget-buddy-org/budget-buddy-workflows/.github/actions/setup-node@6ca650db05a934bd612faac664149938e763cfed
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - run: pnpm run verify
