name: Validate

on:
  pull_request:
    paths:
      - "specs/**"
      - "config/**"
      - ".spectral.yaml"
      - "openapi-ts.config.ts"
      - "openapitools.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - ".github/workflows/**"

permissions:
  contents: read
  packages: read


jobs:
  validate:
    uses: budget-buddy-org/ci-workflows/.github/workflows/contracts-validation.yml@ea9c69008cf58b7f2a40d2d6860f5bdf7d10cb95
