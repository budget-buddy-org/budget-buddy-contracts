name: Validate

on:
  pull_request:
    paths:
      - "specs/**"
      - "config/**"
      - ".spectral.yaml"
      - "openapi-ts.config.ts"
      - "openapitools.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - ".github/workflows/**"

permissions:
  contents: read
  packages: read


jobs:
  validate:
    uses: budget-buddy-org/budget-buddy-workflows/.github/workflows/contracts-validation.yml@6ca650db05a934bd612faac664149938e763cfed

  validate-java-publication:
    name: Validate Java publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: budget-buddy-org/budget-buddy-workflows/.github/actions/setup-java@6ca650db05a934bd612faac664149938e763cfed
      - uses: budget-buddy-org/budget-buddy-workflows/.github/actions/setup-node@6ca650db05a934bd612faac664149938e763cfed
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a

      - name: Generate Java contracts
        run: pnpm run generate:java

      - name: Compile Java publication
        run: ./gradlew build
