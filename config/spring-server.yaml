# openapi-generator config for spring (server stubs)
# Consumers: Java Spring Boot backend — implements the generated API interfaces
# Published to GitHub Packages (Maven) as com.budgetbuddy:budget-buddy-contracts
#
# Coordinates in this config are for generated metadata. Gradle owns Maven publication.
groupId: com.budgetbuddy
artifactId: budget-buddy-contracts
apiPackage: com.budget.buddy.budget_buddy_contracts.generated.api
modelPackage: com.budget.buddy.budget_buddy_contracts.generated.model
interfaceOnly: true
useTags: true
useSpringBoot4: true
openApiNullable: false
# Keep Jackson inclusion and null handling controlled by the application ObjectMapper.
generateJsonIncludeAnnotations: false
generateJsonSetterNullsAnnotations: false
skipOperationExample: true
sourceFolder: src/main/java
useJspecify: true
useJackson3: true
useRecords: true
useSpringController: true
annotationLibrary: none
documentationProvider: none
